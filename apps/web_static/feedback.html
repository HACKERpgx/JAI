<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="google" content="notranslate" />
  <title>JAI Feedback Forum</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="/favicon/favicon.ico">
  <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg">
  <link rel="icon" type="image/png" sizes="96x96" href="/favicon/favicon-96x96.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png">
  <link rel="manifest" href="/favicon/site.webmanifest">
  <style>
    .feedback-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }
    
    .header {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: white;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
      text-align: center;
    }
    
    .feedback-form {
      background: var(--card);
      border: 1px solid #1f2a44;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
    }
    
    .form-group {
      margin-bottom: 15px;
    }
    
    .form-group label {
      display: block;
      margin-bottom: 5px;
      color: var(--muted);
      font-weight: 500;
    }
    
    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #26365c;
      border-radius: 6px;
      background: #0b1426;
      color: var(--text);
      font-family: inherit;
    }
    
    .form-group textarea {
      min-height: 120px;
      resize: vertical;
    }
    
    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s ease;
      margin-right: 10px;
    }
    
    .btn-primary {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: white;
    }
    
    .btn-secondary {
      background: #0b1426;
      color: var(--text);
      border: 1px solid #2b3a5e;
    }
    
    .btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(90, 160, 255, 0.3);
    }
    
    .feedback-list {
      background: var(--card);
      border: 1px solid #1f2a44;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
    }
    
    .feedback-item {
      background: #0e1830;
      border: 1px solid #223055;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 15px;
      transition: transform 0.2s ease;
    }
    
    .feedback-item:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(90, 160, 255, 0.2);
    }
    
    .feedback-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    
    .feedback-title {
      font-weight: bold;
      color: var(--accent);
      margin: 0;
    }
    
    .feedback-meta {
      display: flex;
      gap: 15px;
      font-size: 0.9em;
      color: var(--muted);
    }
    
    .feedback-category {
      background: var(--accent);
      color: white;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 0.8em;
      font-weight: 500;
    }
    
    .feedback-content {
      margin: 10px 0;
      line-height: 1.5;
    }
    
    .feedback-actions {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }
    
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }
    
    .stat-card {
      background: var(--card);
      border: 1px solid #1f2a44;
      border-radius: 12px;
      padding: 20px;
      text-align: center;
    }
    
    .stat-value {
      font-size: 2em;
      font-weight: bold;
      color: var(--accent);
      margin-bottom: 5px;
    }
    
    .stat-label {
      color: var(--muted);
      font-size: 0.9em;
    }
    
    .loading {
      text-align: center;
      padding: 40px;
      color: var(--muted);
    }
    
    .error {
      background: rgba(255, 107, 107, 0.1);
      border: 1px solid var(--danger);
      color: var(--danger);
      padding: 15px;
      border-radius: 6px;
      margin: 20px 0;
    }
    
    .success {
      background: rgba(124, 240, 255, 0.1);
      border: 1px solid var(--accent-2);
      color: var(--accent-2);
      padding: 15px;
      border-radius: 6px;
      margin: 20px 0;
    }
    
    @media (max-width: 768px) {
      .feedback-container {
        padding: 10px;
      }
      
      .stats-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="feedback-container">
    <header class="header">
      <h1>💬 JAI Feedback Forum</h1>
      <p>Share your feedback, suggestions, and experiences with the JAI community</p>
    </header>

    <main class="main">
      <!-- Submit Feedback Form -->
      <section class="feedback-form">
        <h2>📝 Submit Your Feedback</h2>
        <form id="feedbackForm">
          <div class="form-group">
            <label for="feedbackType">Feedback Type</label>
            <select id="feedbackType" name="feedback_type">
              <option value="general">General Feedback</option>
              <option value="bug">Bug Report</option>
              <option value="feature">Feature Request</option>
              <option value="improvement">Improvement Suggestion</option>
              <option value="experience">User Experience</option>
            </select>
          </div>
          
          <div class="form-group">
            <label for="feedbackTitle">Title</label>
            <input type="text" id="feedbackTitle" name="title" placeholder="Brief summary of your feedback..." required>
          </div>
          
          <div class="form-group">
            <label for="feedbackContent">Your Feedback</label>
            <textarea id="feedbackContent" name="content" placeholder="Share your detailed feedback, suggestions, or report issues..." required></textarea>
          </div>
          
          <div class="form-group">
            <label for="feedbackEmail">Email (optional)</label>
            <input type="email" id="feedbackEmail" name="email" placeholder="your.email@example.com">
          </div>
          
          <div class="form-group">
            <label for="feedbackCategory">Category</label>
            <select id="feedbackCategory" name="category">
              <option value="ui">User Interface</option>
              <option value="performance">Performance</option>
              <option value="features">Features</option>
              <option value="voice">Voice & Audio</option>
              <option value="autonomous">Autonomous System</option>
              <option value="email">Email Features</option>
              <option value="other">Other</option>
            </select>
          </div>
          
          <div style="margin-top: 20px;">
            <button type="submit" class="btn btn-primary">Submit Feedback</button>
            <button type="button" class="btn btn-secondary" onclick="clearForm()">Clear</button>
          </div>
        </form>
      </section>

      <!-- Feedback Statistics -->
      <section class="stats-grid">
        <div class="stat-card">
          <div class="stat-value" id="totalFeedback">0</div>
          <div class="stat-label">Total Feedback</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="thisWeek">0</div>
          <div class="stat-label">This Week</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="thisMonth">0</div>
          <div class="stat-label">This Month</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="resolvedIssues">0</div>
          <div class="stat-label">Resolved Issues</div>
        </div>
      </section>

      <!-- Recent Feedback List -->
      <section class="feedback-list">
        <h2>📋 Recent Feedback</h2>
        <div id="feedbackList">
          <div class="loading">Loading feedback...</div>
        </div>
      </section>
    </main>

    <footer class="footer">
      <small>Powered by JAI Community Feedback System</small>
    </footer>
  </div>

  <script>
    let apiBase = 'https://j-ai.top';

    // Initialize page
    document.addEventListener('DOMContentLoaded', function() {
      loadFeedback();
      loadStats();
    });

    // Submit feedback
    document.getElementById('feedbackForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const formData = new FormData(e.target);
      const feedback = {
        feedback_type: formData.get('feedback_type'),
        title: formData.get('title'),
        content: formData.get('content'),
        email: formData.get('email'),
        category: formData.get('category'),
        timestamp: new Date().toISOString()
      };
      
      try {
        const response = await fetch(`${apiBase}/api/feedback`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(feedback)
        });
        
        const result = await response.json();
        
        if (result.success) {
          showSuccess('Feedback submitted successfully! Thank you for your contribution.');
          clearForm();
          loadFeedback(); // Refresh the feedback list
          loadStats();   // Refresh statistics
        } else {
          showError('Failed to submit feedback: ' + result.error);
        }
      } catch (error) {
        showError('Error submitting feedback: ' + error.message);
      }
    });

    // Load feedback list
    async function loadFeedback() {
      try {
        const response = await fetch(`${apiBase}/api/feedback`);
        const data = await response.json();
        
        if (data.success && data.feedback) {
          displayFeedback(data.feedback);
        } else {
          document.getElementById('feedbackList').innerHTML = '<div class="error">Failed to load feedback</div>';
        }
      } catch (error) {
        document.getElementById('feedbackList').innerHTML = '<div class="error">Error loading feedback</div>';
      }
    }

    // Display feedback
    function displayFeedback(feedback) {
      const feedbackList = document.getElementById('feedbackList');
      
      if (feedback.length === 0) {
        feedbackList.innerHTML = '<p style="text-align: center; color: var(--muted);">No feedback submitted yet. Be the first to share your thoughts!</p>';
        return;
      }
      
      feedbackList.innerHTML = feedback.map(item => `
        <div class="feedback-item">
          <div class="feedback-header">
            <div class="feedback-title">${escapeHtml(item.title)}</div>
            <div class="feedback-meta">
              <span class="feedback-category">${item.feedback_type.toUpperCase()}</span>
              <span>${formatDate(item.timestamp)}</span>
            </div>
          </div>
          <div class="feedback-content">${escapeHtml(item.content)}</div>
          <div class="feedback-actions">
            <button class="btn btn-secondary" onclick="likeFeedback('${item.id}')">👍 Like</button>
            <button class="btn btn-secondary" onclick="replyFeedback('${item.id}')">💬 Reply</button>
          </div>
        </div>
      `).join('');
    }

    // Load statistics
    async function loadStats() {
      try {
        const response = await fetch(`${apiBase}/api/feedback/stats`);
        const data = await response.json();
        
        if (data.success && data.stats) {
          document.getElementById('totalFeedback').textContent = data.stats.total || 0;
          document.getElementById('thisWeek').textContent = data.stats.this_week || 0;
          document.getElementById('thisMonth').textContent = data.stats.this_month || 0;
          document.getElementById('resolvedIssues').textContent = data.stats.resolved_issues || 0;
        }
      } catch (error) {
        console.error('Error loading stats:', error);
      }
    }

    // Clear form
    function clearForm() {
      document.getElementById('feedbackForm').reset();
    }

    // Like feedback
    async function likeFeedback(feedbackId) {
      try {
        const response = await fetch(`${apiBase}/api/feedback/${feedbackId}/like`, {
          method: 'POST'
        });
        
        const result = await response.json();
        if (result.success) {
          showSuccess('Feedback liked!');
        } else {
          showError('Failed to like feedback');
        }
      } catch (error) {
        showError('Error liking feedback');
      }
    }

    // Reply to feedback
    function replyFeedback(feedbackId) {
      const reply = prompt('Enter your reply:');
      if (reply) {
        submitReply(feedbackId, reply);
      }
    }

    // Submit reply
    async function submitReply(feedbackId, reply) {
      try {
        const response = await fetch(`${apiBase}/api/feedback/${feedbackId}/reply`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ reply })
        });
        
        const result = await response.json();
        if (result.success) {
          showSuccess('Reply submitted!');
          loadFeedback(); // Refresh feedback list
        } else {
          showError('Failed to submit reply');
        }
      } catch (error) {
        showError('Error submitting reply');
      }
    }

    // Utility functions
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function formatDate(timestamp) {
      const date = new Date(timestamp);
      return date.toLocaleDateString() + ' ' + date.toLocaleTimeString();
    }

    // Show messages
    function showError(message) {
      const errorDiv = document.createElement('div');
      errorDiv.className = 'error';
      errorDiv.textContent = '❌ ' + message;
      document.querySelector('.feedback-container').insertBefore(errorDiv, document.querySelector('.main'));
      
      setTimeout(() => errorDiv.remove(), 5000);
    }

    function showSuccess(message) {
      const successDiv = document.createElement('div');
      successDiv.className = 'success';
      successDiv.textContent = '✅ ' + message;
      document.querySelector('.feedback-container').insertBefore(successDiv, document.querySelector('.main'));
      
      setTimeout(() => successDiv.remove(), 3000);
    }

    // Load API base from localStorage
    function loadApiBase() {
      const saved = localStorage.getItem('jai_api_base');
      if (saved) {
        apiBase = saved;
      }
    }

    loadApiBase();
  </script>
</body>
</html>
