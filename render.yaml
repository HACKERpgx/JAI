services:
  - type: web
    name: jai-website
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-render.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.5"
      - key: PORT
        value: "10000"
    healthCheckPath: /
    autoDeploy: true
    domains:
      - j-ai.top