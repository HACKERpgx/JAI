services:
  - type: web
    name: jai-website
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-render.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    workingDir: .
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.5"
      - key: PORT
        value: "10000"
      # Supabase Auth Configuration
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      # Apply the subscription-state migration before enabling paid access enforcement.
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false
      - key: JAI_PUBLIC_URL
        value: https://j-ai.top
      # Enable only after secrets, migration, Stripe recurring price, and webhook are configured.
      - key: JAI_REQUIRE_ACTIVE_SUBSCRIPTION
        value: "false"
      - key: JAI_REQUIRE_BYOK
        value: "false"
    healthCheckPath: /
    autoDeploy: true
    domains:
      - j-ai.top
